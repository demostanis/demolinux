corner-radius = 5;

shadow = true;
shadow-radius = 50;
shadow-offset-x = -50;
shadow-offset-y = -50; 

fading = true;
fade-delta = 20;

backend = "glx";
// Moving native Firefox popups can leave stale pixels with damage tracking.
use-damage = false;

blur: {
  method = "dual_kawase";
  kern = "11x11gaussian";
  strength = 10;
  deviation = 1;
}

animations = ({
  triggers = [ "position" ];
  offset-x = { start = "window-x-before - window-x"; end = 0; duration = 0.3; curve = "cubic-bezier(0.22, 1, 0.36, 1)"; };
  offset-y = { start = "window-y-before - window-y"; end = 0; duration = 0.3; curve = "cubic-bezier(0.22, 1, 0.36, 1)"; };
  shadow-offset-x = "offset-x";
  shadow-offset-y = "offset-y";

});

rules = (
  { match = "fullscreen"; corner-radius = 0; },
  { match = "!override_redirect && !wmwin && window_type != 'desktop'"; animations = ({
    triggers = [ "size" ];
    preset = "geometry-change";
    duration = 0.25;
  }); },
  { dim = 0.3; fade = false; },
  { match = "focused || name = 'Awesome drawin' || name = 'overview_client_icon' || (class_g = 'Firefox' && argb)"; dim = 0; },
  { match = "name = 'overview_client_icon' || (name = 'Firefox' && argb)"; shadow = false; },
  { match = "class_g = 'splash' || name = 'picom_fade_in'"; fade = true; },
  { match = "name != 'overview_client_icon' && class_g != 'mpv' && class_g != 'imv' && class_g != 'slop' && role != 'Popup'"; opacity = 1; },
  { match = "name = 'Awesome drawin'"; opacity = 0.85; },
  { match = "name ^= 'opencode_sidewindow_' || OPENCODE_SIDEWINDOW@ = 1"; animations = ({
    triggers = [ "open", "show" ];
    suppressions = [ "size", "position", "increase-opacity", "decrease-opacity" ];
    opacity = "window-raw-opacity";
    crop-x = "window-x";
    crop-y = "window-y";
    crop-width = { start = 0; end = "window-width"; duration = 0.25; curve = "cubic-bezier(0.22, 1, 0.36, 1)"; };
    crop-height = "window-height";
  }, {
    triggers = [ "close", "hide" ];
    suppressions = [ "size", "position", "increase-opacity", "decrease-opacity" ];
    opacity = { start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; duration = 0.25; };
    crop-x = "window-x";
    crop-y = "window-y";
    crop-width = { start = "window-width"; end = 0; duration = 0.25; curve = "cubic-bezier(0.4, 0, 1, 1)"; };
    crop-height = "window-height";
  }); },
  { match = "name ^= 'opencode_sidewindow_'"; dim = 0; opacity = 0.85; animations = ({
    triggers = [ "size" ];
    preset = "geometry-change";
    duration = 0.25;
  }); },
  { match = "class_g = 'splash'"; opacity = 0.3; },
  { match = "name = 'overview_client_icon' || class_g = 'slop' || role = 'Popup'"; blur-background = false; },
  { match = "name = 'overview_client_preview'"; dim = 0; opacity = 1; shadow = false; animations = ({
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.3;
  }); },
  { match = "name = 'overview_input_shield'"; dim = 0; opacity = 1; shadow = false; fade = false; corner-radius = 0; blur-background = false; },
  { match = "name = 'overview_chrome_snapshot'"; dim = 0; opacity = 1; shadow = false; fade = false; corner-radius = 0; blur-background = false; },
  { match = "OVERVIEW_SHADOW_SUPPRESSED@ = 1"; shadow = false; },
  { match = "OVERVIEW_REAL_HIDDEN@ = 1"; opacity = 0; shadow = false; fade = false; blur-background = false; blur-opacity = 0; },
  { match = "OVERVIEW_PARTICIPANT@ = 1"; animations = ({
    triggers = [ "increase-opacity", "decrease-opacity" ];
    opacity = "window-raw-opacity";
    blur-opacity = "window-blur-opacity";
  }); },
  { match = "name = 'picom_fade_in' || name = 'overview_chrome_snapshot'"; animations = ({
    triggers = [ "geometry" ];
    offset-x = 0;
    offset-y = 0;
    scale-x = 1;
    scale-y = 1;
    shadow-offset-x = 0;
    shadow-offset-y = 0;
    shadow-scale-x = 1;
    shadow-scale-y = 1;
  }); },
  { match = "name ^= 'overview_'"; shadow = false; },
  { match = "name = 'overview_client_label' || name = 'overview_filter'"; dim = 0; opacity = 0.85; },
  { match = "name = 'overview_client_preview'"; shadow = true; },
  { match = "name ^= 'awesome_ui_'"; dim = 0; opacity = 0.85; animations = ({
    triggers = [ "open", "show" ];
    suppressions = [ "size", "position" ];
    preset = "appear";
    scale = 0.98;
    duration = 0.18;
  }, {
    triggers = [ "close", "hide" ];
    suppressions = [ "size", "position" ];
    preset = "disappear";
    scale = 0.98;
    duration = 0.12;
  }, {
    triggers = [ "geometry" ];
    offset-x = 0;
    offset-y = 0;
    scale-x = 1;
    scale-y = 1;
    shadow-offset-x = 0;
    shadow-offset-y = 0;
    shadow-scale-x = 1;
    shadow-scale-y = 1;
  }); },
  { match = "window_type = 'notification'"; animations = ({
    triggers = [ "open", "show" ];
    suppressions = [ "size", "position" ];
    preset = "appear";
    scale = 0.99;
    duration = 0.16;
  }, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.99;
    duration = 0.12;
  }); },
  { match = "DEMOLINUX_MANUAL_RESIZE@ = 1"; animations = ({
    triggers = [ "geometry" ];
    offset-x = 0;
    offset-y = 0;
    scale-x = 1;
    scale-y = 1;
    shadow-offset-x = 0;
    shadow-offset-y = 0;
    shadow-scale-x = 1;
    shadow-scale-y = 1;
  }); }

);
