name: default

on:
  push:
    branches: [master, trigger]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ github.ref_name == 'trigger' && 'nightly' || 'release' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    # Cold dependency builds are intentionally allowed to seed the caches.
    timeout-minutes: 90
    env:
      DEMOLINUX_NETWORK_BACKEND: user
      DEMOLINUX_ROOTFS_CACHE: ${{ github.workspace }}/.ci/rootfs
      DEMOLINUX_PACMAN_CACHE: ${{ github.workspace }}/.ci/pacman
      DEMOLINUX_SSH_KEY: ${{ github.workspace }}/.ci/test-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check CI helpers and compute cache keys
        id: inputs
        run: |
          python3 .github/test-ci.py
          {
            echo "started=$(date +%s)"
            echo "base=$(python3 bin/build-inputs base)"
            echo "packages=$(python3 bin/build-inputs packages)"
            echo "rootfs=$(python3 bin/build-inputs rootfs)"
          } >> "$GITHUB_OUTPUT"

      - name: Start build-tool setup while restoring caches
        run: |
          mkdir -p .ci
          # shellcheck disable=SC2016
          nohup bash -c '
            result=0
            bash .github/setup-pacman.sh || result=$?
            printf "%s\n" "$result" > .ci/setup.status.tmp
            mv .ci/setup.status.tmp .ci/setup.status
          ' > .ci/setup.log 2>&1 < /dev/null &

      - name: Restore installed root filesystem
        id: rootfs
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .ci/rootfs
          key: rootfs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.rootfs }}

      - name: Restore compiled packages and downloads
        id: packages
        if: steps.rootfs.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            packages/db
            packages/nvimcache
            packages/zshcache
            .ci/pacman
          key: packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.base }}-${{ steps.inputs.outputs.packages }}
          restore-keys: |
            packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.base }}-

      - name: Set up build tools
        timeout-minutes: 5
        run: |
          until [[ -f .ci/setup.status ]]; do sleep 0.2; done
          cat .ci/setup.log
          result=$(<.ci/setup.status)
          [[ "$result" == 0 ]] || exit "$result"
          python3 .github/test-ci.py

      - name: Generate a temporary SSH key for tests
        run: |
          mkdir -p .ci
          ssh-keygen -t ed25519 -f "$DEMOLINUX_SSH_KEY" -q -N ''

      - name: Validate image-cache filesystem integrity
        run: sudo env DEMOLINUX_DISK_TESTS=1 python3 .github/test-ci.py DiskIntegrationTests

      - name: Build an image
        run: ./demolinux build

      # Save before testing so a VM failure does not force another cold build.
      - name: Save compiled packages and downloads
        if: steps.rootfs.outputs.cache-hit != 'true' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            packages/db
            packages/nvimcache
            packages/zshcache
            .ci/pacman
          key: ${{ steps.packages.outputs.cache-primary-key }}

      - name: Save installed root filesystem
        if: steps.rootfs.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .ci/rootfs
          key: ${{ steps.rootfs.outputs.cache-primary-key }}

      - name: Free build space for VM overlays and release chunks
        run: sudo rm -rf work packages .ci/rootfs .ci/pacman

      - name: Prepare release files while testing
        run: |
          # shellcheck disable=SC2016
          nohup bash -c '
            result=0
            python3 .github/prepare-release.py out/demolinux*.img || result=$?
            printf "%s\n" "$result" > .ci/release.status.tmp
            mv .ci/release.status.tmp .ci/release.status
          ' > .ci/release.log 2>&1 < /dev/null &

      - name: Run all tests in isolated VMs
        run: bash .github/run-tests.sh out/demolinux*.img

      - name: Delete the temporary SSH key
        if: always()
        run: rm -f -- "$DEMOLINUX_SSH_KEY" "$DEMOLINUX_SSH_KEY.pub"

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics
          path: |
            .ci/tests
            .ci/setup.log
            .ci/release.log
          retention-days: 7

      - name: Await prepared release files
        timeout-minutes: 5
        run: |
          until [[ -f .ci/release.status ]]; do sleep 0.2; done
          cat .ci/release.log
          exit "$(<.ci/release.status)"

      - name: Publish release
        if: github.ref == 'refs/heads/trigger' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/publish-release.py

      - name: Report execution time and cache hits
        if: always() && steps.inputs.outputs.started != ''
        env:
          STARTED: ${{ steps.inputs.outputs.started }}
          ROOTFS_HIT: ${{ steps.rootfs.outputs.cache-hit }}
          PACKAGES_HIT: ${{ steps.packages.outputs.cache-hit }}
        run: |
          {
            echo "Execution time (excluding runner queue): $(($(date +%s) - STARTED)) seconds"
            echo "Installed-root cache hit: ${ROOTFS_HIT:-false}"
            echo "Exact package cache hit: ${PACKAGES_HIT:-not restored}"
            echo 'Warm-cache target: under 300 seconds, including all tests and publication.'
          } >> "$GITHUB_STEP_SUMMARY"
